name: Android build

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Briar debug APK
        run: ./gradlew --no-daemon :briar-android:assembleOfficialDebug

      - name: Run API/core tests
        run: ./gradlew --no-daemon :bramble-api:test :bramble-core:test

      - name: Package source
        run: git archive --format=zip --output=briar-modified-source.zip HEAD

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: briar-modified-build
          path: |
            briar-modified-source.zip
            briar-android/build/outputs/apk/**/*.apk
