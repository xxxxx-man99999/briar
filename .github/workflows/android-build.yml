name: Android build

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build Briar debug APK
        run: ./gradlew --no-daemon :briar-android:assembleOfficialDebug

      - name: Run API/core tests
        run: ./gradlew --no-daemon :bramble-api:test :bramble-core:test

      - name: Package source
        run: git archive --format=zip --output=briar-modified-source.zip HEAD

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: briar-modified-build
          path: |
            briar-modified-source.zip
            briar-android/build/outputs/apk/**/*.apk

  emulator-smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build APK for emulator
        run: ./gradlew --no-daemon :briar-android:assembleOfficialDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot Android 10 emulator and smoke-test Briar
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -noaudio -no-boot-anim
          disable-animations: true
          script: |
            APK=$(find briar-android/build/outputs/apk -type f -name '*.apk' -print -quit)
            echo "Using APK: $APK"
            test -n "$APK"
            adb install -r "$APK"
            adb shell am force-stop org.briarproject.briar.android.debug
            adb shell monkey -p org.briarproject.briar.android.debug 1
            adb shell input keyevent KEYCODE_WAKEUP
            sleep 10
            adb shell dumpsys activity activities | grep -q 'org.briarproject.briar.android'
            adb exec-out screencap -p > briar-emulator-startup.png

      - name: Upload emulator screenshot
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: briar-emulator-smoke
          path: briar-emulator-startup.png
          if-no-files-found: warn
